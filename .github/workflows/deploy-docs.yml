name: Build and Deploy Javadoc

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
    # Only trigger when there is a code change related to tori-api or pom.xml
    paths:
      - 'tori-api/**'
      - 'tori-base/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Build project and create javadoc jar
      - name: Generate Aggregate Javadoc
        run: mvn clean package javadoc:aggregate -DskipTests

      # Handling logical branching: Snapshot vs Release
      - name: Prepare Javadoc Site Structure
        run: |
          mkdir -p javadoc-site
          
          # check aggregate javadoc folder has created on root pom
          APIDOCS_DIR="target/site/apidocs"
          
          if [ ! -d "$APIDOCS_DIR" ]; then
            echo "❌ Cannot find aggregate apidocs directory at $APIDOCS_DIR!"
            exit 1
          fi
          
          echo "Found aggregate Javadoc directory at: $APIDOCS_DIR"

          # logic Release vs Push Dev/Snapshot
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "📦 Processing Official Release deployment..."
          
            # stable latest (/Tori)
            mkdir -p javadoc-site/Tori
            cp -r "$APIDOCS_DIR"/* javadoc-site/Tori/
          
            # archive as version tag (ví dụ: /26.9.1)
            VERSION="${{ github.ref_name }}"
            mkdir -p "javadoc-site/$VERSION"
            cp -r "$APIDOCS_DIR"/* "javadoc-site/$VERSION/"
          
          else
            echo "⚡ Processing Snapshot/Dev Push deployment..."
          
            # push to folder snapshot
            mkdir -p javadoc-site/snapshot
            cp -r "$APIDOCS_DIR"/* javadoc-site/snapshot/
          
            # ensure folder Tori always has data to prevent 404
            if [ ! -d "javadoc-site/Tori" ]; then
              mkdir -p javadoc-site/Tori
              cp -r "$APIDOCS_DIR"/* javadoc-site/Tori/
            fi
          fi

          # create file index.html auto redirect to /Tori/
          cat << 'EOF' > javadoc-site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url='/Tori/'" />
            </head>
            <body>
              <p>Redirecting to <a href="/Tori/">Javadoc</a>...</p>
            </body>
          </html>
          EOF

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy javadoc-site --project-name=tori-docs --branch=main