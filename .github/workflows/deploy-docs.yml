name: Build and Deploy Javadoc

on:
  release:
    types: [published]
  workflow_dispatch: # Allow clicking the 'Run workflow' button manually to test at any time

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Build project and create javadoc jar
      - name: Build with Maven
        run: mvn clean package javadoc:jar -DskipTests

      # Extract javadoc of tori-api and configure multi-version
      - name: Prepare Javadoc Site Structure
        run: |
          mkdir -p javadoc-site/Tori
          
          # get file javadoc jar of module tori-api
          API_JAVADOC_JAR=$(find tori-api/target -name "*-javadoc.jar" | head -n 1)
          
          if [ -z "$API_JAVADOC_JAR" ]; then
            echo "❌ Cannot found javadoc jar in tori-api/target!"
            exit 1
          fi
          
          echo "Found javadoc artifact: $API_JAVADOC_JAR"
          unzip -q "$API_JAVADOC_JAR" -d javadoc-site/Tori

          # Get version from release tag (or revision variable if running manually)
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="26.8.301"
          fi

          # Copy an additional folder version for parallel storage (vd: /26.8.301)
          mkdir -p "javadoc-site/$VERSION"
          cp -r javadoc-site/Tori/* "javadoc-site/$VERSION/"

          # Create the original index.html file that navigates directly to /Tori
          cat << 'EOF' > javadoc-site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url='/Tori/'" />
            </head>
            <body>
              <p>Redirecting to <a href="/Tori/">Javadoc</a>...</p>
            </body>
          </html>
          EOF

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy javadoc-site --project-name=tori-docs --branch=main