name: Build and Deploy Javadoc

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
    # Only trigger when there is a code change related to tori-api or pom.xml
    paths:
      - 'tori-api/**'
      - 'tori-base/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Build project and create javadoc jar
      - name: Build with Maven
        run: mvn clean package javadoc:jar -DskipTests

      # Handling logical branching: Snapshot vs Release
      - name: Prepare Javadoc Site Structure
        run: |
          mkdir -p javadoc-site
          
          # search file javadoc jar of tori-api
          API_JAVADOC_JAR=$(find tori-api/target -name "*-javadoc.jar" | head -n 1)
          
          if [ -z "$API_JAVADOC_JAR" ]; then
            echo "❌ Cannot find javadoc jar in tori-api/target!"
            exit 1
          fi
          
          echo "Found javadoc artifact: $API_JAVADOC_JAR"

          # Extract temporarily to a temp folder
          mkdir -p tmp-docs
          unzip -q "$API_JAVADOC_JAR" -d tmp-docs

          # check event type activating workflow
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "📦 Processing Official Release deployment..."
          
            # update stable version (release) (/Tori)
            mkdir -p javadoc-site/Tori
            cp -r tmp-docs/* javadoc-site/Tori/
          
            # save as tag version (vd: /26.8.301)
            VERSION="${{ github.ref_name }}"
            mkdir -p "javadoc-site/$VERSION"
            cp -r tmp-docs/* "javadoc-site/$VERSION/"
          
          else
            echo "⚡ Processing Snapshot/Dev Push deployment..."
          
            # push to folder snapshot
            mkdir -p javadoc-site/snapshot
            cp -r tmp-docs/* javadoc-site/snapshot/
          
            # If there is no Tori folder (first deploy), create it temporarily to avoid 404
            if [ ! -d "javadoc-site/Tori" ]; then
              mkdir -p javadoc-site/Tori
              cp -r tmp-docs/* javadoc-site/Tori/
            fi
          fi

          # 3. create file index.html
          cat << 'EOF' > javadoc-site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url='/Tori/'" />
            </head>
            <body>
              <p>Redirecting to <a href="/Tori/">Javadoc</a>...</p>
            </body>
          </html>
          EOF

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy javadoc-site --project-name=tori-docs --branch=main